[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai_agents"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "raghad" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]


dependencies = [
    "arxiv>=4.0.1",
    "ddgs>=9.16.0",
    "langchain>=1.2.11",          # ← add back, langfuse's CallbackHandler needs it
    "langchain-core>=1.0.0",       # now resolves to 1.6.6, compatible with langchain>=1.2.11
    "langchain-ollama==1.0.0",
    "langfuse==4.0.1",
    "langgraph==1.1.0",
    "langgraph-checkpoint-sqlite==3.0.3",
    "mcp==1.26.0",
    "pip",
    "pydantic==2.11.9",
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
    "python-dotenv",
    "rich>=13.6.0,<15.0.0",
    "ruff",
    "deepeval==3.9.1",
]
requires-python = "~=3.10.0"




[tool.ruff]
line-length = 99
src = ["ai_agents"]
include = ["pyproject.toml", "ai_agents/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ai_agents"]
force-sort-within-sections = true

